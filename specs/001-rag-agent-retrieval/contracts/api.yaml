openapi: 3.0.0
info:
  title: RAG Agent Service API
  version: 1.0.0
  description: API for interacting with the RAG Agent Service, which answers questions about book content using retrieval.
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /chat:
    post:
      summary: Ask a question to the RAG Agent
      operationId: askQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentQuery'
      responses:
        '200':
          description: Successful response from the agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Invalid request payload or missing query
        '500':
          description: Internal server error
components:
  schemas:
    AgentQuery:
      type: object
      properties:
        query_text:
          type: string
          description: The natural language question or prompt from the user.
          example: "What are the key features of Nav2?"
        context_snippet:
          type: string
          nullable: true
          description: An optional text snippet to limit the agent's response context.
          example: "According to this text, what are the key features?"
      required:
        - query_text
    AgentResponse:
      type: object
      properties:
        response_text:
          type: string
          description: The natural language answer generated by the AI agent.
          example: "Nav2 provides modular, extensible tools for navigation in ROS 2."
        source_references:
          type: array
          items:
            type: string
          nullable: true
          description: URLs or identifiers of the documents from which information was retrieved.
          example: ["https://example.com/docs/nav2"]
        used_context:
          type: string
          nullable: true
          description: The specific context (retrieved chunks or provided snippet) used by the agent.
          example: "Nav2 is a navigation framework for ROS 2."
      required:
        - response_text
