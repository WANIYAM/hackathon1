openapi: 3.0.0
info:
  title: RAG Chatbot API
  version: 1.0.0
  description: API for interacting with the RAG (Retrieval Augmented Generation) chatbot backend.

paths:
  /query:
    post:
      summary: Submit a query to the RAG chatbot
      operationId: submitQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: The user's question or prompt for the RAG chatbot.
                  example: "What is Docusaurus?"
                context:
                  type: string
                  nullable: true
                  description: Optional selected text from the Docusaurus book to provide additional context for the query.
                  example: "Docusaurus is a static site generator..."
      responses:
        '200':
          description: Successful response from the RAG chatbot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                    description: The answer generated by the RAG chatbot.
                    example: "Docusaurus is an open-source framework to build optimized websites easily."
        '400':
          description: Invalid request payload.
        '500':
          description: Internal server error or RAG agent failure.
